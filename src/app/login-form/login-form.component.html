<form [formGroup]="loginForm">
  <mat-form-field>
    <input type="text" matInput formControlName="email" placeholder="email" />
    <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
      Email is required
    </mat-error>
  </mat-form-field>
</form>
